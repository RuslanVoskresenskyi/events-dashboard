services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "3005:5432"
    volumes:
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "3006:6379"
volumes:
  postgres_data: