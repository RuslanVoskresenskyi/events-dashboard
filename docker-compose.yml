services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "3005:5432"
    volumes:
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "3006:6379"
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
volumes:
  postgres_data: